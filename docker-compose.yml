services:
  app:
    # deploy.sh replaces this with a revision-specific tag. The fallback keeps
    # ad-hoc `docker compose build/up` workflows working for local operators.
    image: ${APP_IMAGE:-svelte-realtime-demo-app:local}
    build:
      context: .
      args:
        # Build-time stub - vite's analyze step imports news.js which throws
        # at module load when NODE_ENV=production and the secret is unset.
        # The stub satisfies the check during build; the runtime value below
        # is what actually verifies webhook signatures in production.
        DEMO_NEWS_WEBHOOK_SECRET: build-stub
    # Host networking is load-bearing here: both replicas bind host:443 via
    # SO_REUSEPORT clustering, and the host kernel distributes inbound
    # connections across them at the network-stack level. Bridge networking
    # with explicit port publishing would let only one container hold 443,
    # collapsing the multi-replica architecture. See `cap_add` below for how
    # the non-root `node` user retains the ability to bind 443 directly.
    network_mode: host
    cap_add:
      # Lets the non-root `node` user bind privileged ports (443) inside the
      # container. The Dockerfile sets the matching file capability on the
      # node binary; both layers are required - kernel needs `cap_add` to
      # surface the cap inside the namespace, AND the binary needs the
      # filecaps bit so a non-root caller can use it.
      - NET_BIND_SERVICE
    volumes:
      - certs:/etc/letsencrypt:ro
    environment:
      # Host networking means the app shares the host's loopback. Postgres
      # and redis publish only to `127.0.0.1:5432` / `127.0.0.1:6379` (see
      # below), so the app reaches them via the host loopback - same DNS
      # the operator's `psql` / `redis-cli` shell would use. The app
      # connects as the non-superuser `stickynotes_app` role (created on
      # first init by Dockerfile.postgres; see CHANGELOG for the one-shot
      # migration step existing deployments must run manually).
      DATABASE_URL: postgres://stickynotes_app:${STICKYNOTES_APP_PASSWORD:?required}@127.0.0.1:5432/stickynotes
      # The `:${REDIS_PASSWORD:-}@` form expands to bare `redis://:@127.0.0.1:6379`
      # when REDIS_PASSWORD is unset (ioredis treats empty password as "none"
      # and the auth handshake is skipped) and to `redis://:<secret>@127.0.0.1:6379`
      # when set. Existing deployments without REDIS_PASSWORD see no behavior
      # change; setting it enables the AUTH handshake in lockstep with the
      # redis service's --requirepass below.
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@127.0.0.1:6379
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-2000}
      REDIS_SESSION_TIMEOUT_MS: ${REDIS_SESSION_TIMEOUT_MS:-1000}
      READINESS_TIMEOUT_MS: ${READINESS_TIMEOUT_MS:-2500}
      # CRITICAL: svelte-realtime gates dev-only diagnostics on
      # `process.env.NODE_ENV !== 'production'`. With NODE_ENV unset, the
      # framework treats the process as dev and arms a per-platform
      # `setInterval` publish-rate-warning sampler (registered in a
      # `Set` keyed by platform identity). Combined with the cron tick's
      # per-fire `bus.wrap(_cronPlatform)` minting a fresh wrapped
      # platform on every fire, the Set accumulates one entry per cron
      # tick at ~7 Hz - each entry holding an active timer plus the
      # full helpers/closures graph. Heap grows by ~100 MB/hr until OOM.
      # Setting NODE_ENV=production constant-folds the dev branch dead.
      NODE_ENV: production
      PORT: "443"
      ORIGIN: https://${DOMAIN:?required}
      SSL_CERT: /etc/letsencrypt/live/${DOMAIN}/fullchain.pem
      SSL_KEY: /etc/letsencrypt/live/${DOMAIN}/privkey.pem
      # Required in production: news.js throws at module load when
      # NODE_ENV=production and this is unset, because the legacy fallback
      # was a static string checked into the repo (forgeable webhook events).
      # Dev keeps the static fallback so a fresh checkout works without env
      # setup. The build-arg above carries a stub through `vite build` so
      # the analyze-step import does not throw at image-build time; this
      # runtime value is what actually verifies inbound webhook signatures.
      DEMO_NEWS_WEBHOOK_SECRET: ${DEMO_NEWS_WEBHOOK_SECRET:?required}
      # Optional. When set, /metrics requires the scraper to send a matching
      # X-Scrape-Token header and 401s otherwise. When unset (default), the
      # endpoint stays open - no behavior change for existing deployments
      # scraping without auth.
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      # Cursor per-connection and per-topic throttle, in milliseconds. Default
      # 8ms = ~120Hz both layers; set to 16 / 33 to match a 60Hz / 30Hz client
      # publish rate (CURSOR_INTERVAL_MS on the destroyer side). The two must
      # move together to keep per-cursor dedup effective; mismatched values
      # produce a degenerate "every cursor every cycle" dirty map. Operators
      # can change these and restart only the app service (no rebuild needed)
      # via `docker compose up -d app`.
      CURSOR_THROTTLE_MS: ${CURSOR_THROTTLE_MS:-8}
      CURSOR_TOPIC_THROTTLE_MS: ${CURSOR_TOPIC_THROTTLE_MS:-8}
      # entrypoint.sh fingerprints the read-only Let's Encrypt source files.
      # Once a renewed cert/key pair is stable for two polls, each replica
      # exits gracefully after independent jitter; restart: unless-stopped
      # brings it back with a fresh node-readable copy. Staggering keeps at
      # least part of the SO_REUSEPORT pool available during normal renewal.
      CERT_RELOAD_POLL_SECONDS: ${CERT_RELOAD_POLL_SECONDS:-30}
      CERT_RELOAD_JITTER_MAX_SECONDS: ${CERT_RELOAD_JITTER_MAX_SECONDS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "scripts/container-healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      replicas: ${APP_REPLICAS:-4}

  # Canonical pre-traffic schema path. It runs for fresh volumes and upgrades,
  # records checksums, then exits before any app replica is eligible to start.
  migrate:
    image: ${APP_IMAGE:-svelte-realtime-demo-app:local}
    build:
      context: .
      args:
        DEMO_NEWS_WEBHOOK_SECRET: build-stub
    network_mode: host
    environment:
      DATABASE_URL: postgres://stickynotes_app:${STICKYNOTES_APP_PASSWORD:?required}@127.0.0.1:5432/stickynotes
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "migrate"]
    restart: "no"

  certbot:
    image: certbot/certbot
    volumes:
      - certs:/etc/letsencrypt
      - ./scripts/verify-served-cert.sh:/usr/local/bin/verify-served-cert:ro
    environment:
      DOMAIN: ${DOMAIN:?required}
      # Avoid relying on public-IP hairpin routing from the bridge network;
      # SNI still verifies the configured public domain.
      CERT_SERVE_HOST: host.docker.internal
      CERT_SERVE_TIMEOUT_SECONDS: ${CERT_SERVE_TIMEOUT_SECONDS:-150}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    entrypoint: sh
    command:
      - -c
      - |
        set -u
        trap exit TERM
        while :; do
          certbot renew --standalone --preferred-challenges http \
            || echo "certbot renew failed; retrying at the next interval"
          sh /usr/local/bin/verify-served-cert \
            || echo "verify-served-cert failed; retrying at the next interval"
          sleep 12h & wait $${!}
        done
    restart: unless-stopped

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    # Bind to 127.0.0.1 only. The app uses `network_mode: host` so it
    # connects via the host's loopback at 127.0.0.1:5432 - this bind is
    # exactly the reachability surface the app needs. External clients
    # (the operator running `psql -h <host> -p 5432` from another machine)
    # are blocked; use `docker exec -it <container> psql ...` instead, or
    # temporarily open the port in a sidecar config. Mirrors the docs repo's
    # pre-existing 127.0.0.1 bind.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: stickynotes
      # Passed to /docker-entrypoint-initdb.d/00-init-app-role.sh on first
      # init so it can CREATE ROLE stickynotes_app with this password.
      # Ignored on subsequent container starts (initdb only runs once per
      # data volume).
      STICKYNOTES_APP_PASSWORD: ${STICKYNOTES_APP_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stickynotes"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    # redis:7-alpine pinned by digest. Bump manually when pulling in upstream
    # patches; the operator owns the cadence.
    image: redis:7-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    # `--protected-mode no` removed: the container is now bound to
    # 127.0.0.1 (see ports below) so the protected-mode default fail-closed
    # behavior never fires from a real-world external connection anyway,
    # but dropping the override keeps the defense layer intact for the case
    # someone accidentally exposes the container to a public interface in
    # the future.
    #
    # AUTH support is opt-in. When REDIS_PASSWORD is set in the env, the
    # server starts with --requirepass; the app's REDIS_URL above carries
    # the matching password. When unset, redis runs unauthenticated as it
    # always did - no behavior change for existing deployments.
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
        else
          exec redis-server --appendonly yes
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      # Healthcheck also needs the password when set, otherwise redis-cli
      # ping fails with NOAUTH and the container loops on unhealthy.
      test:
        - CMD-SHELL
        - if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping; else redis-cli ping; fi
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  certs:
  pgdata:
  redisdata:
