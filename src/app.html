<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="/svelte_orange_logo_only.png" />
		<title>Svelte Realtime Demo</title>
		<script>
			// Applies the stored theme before first paint so a returning
			// dark-theme visitor never sees a flash of light. The toggle that
			// writes this key lives in src/routes/+layout.svelte; with no
			// stored choice we follow the OS preference.
			try {
				var stored = localStorage.getItem('theme')
				document.documentElement.dataset.theme =
					stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
			} catch (error) {
				// localStorage throws in some private modes; the default theme stands.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
